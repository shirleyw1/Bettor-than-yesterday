name: Update CFB picks
on:
  schedule:
    - cron: "0 13 * * 0,3,5,6"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python cfb_picks.py
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      - run: |
          git config user.name "picks-bot"
          git config user.email "bot@users.noreply.github.com"
          git add cfb
          git commit -m "Update CFB picks" || exit 0
          git pull --rebase
          git push
