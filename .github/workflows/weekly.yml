name: Update picks

on:
  schedule:
    - cron: "0 18 * * 2"   # Tuesday, 18:00 UTC (injured reserve moves after Monday night)
    - cron: "0 15 * * 3"   # Wednesday, 15:00 UTC
    - cron: "0 15 * * 4"   # Thursday, 15:00 UTC
    - cron: "0 21 * * 5"   # Friday, 21:00 UTC (final injury report) - the one run that fetches sportsbook odds
    - cron: "0 15 * * 6"   # Saturday, 15:00 UTC
    - cron: "0 14 * * 0"   # Sunday, 14:00 UTC
    - cron: "15 16 * * 0"  # Sunday, 16:15 UTC (after the 90-minute inactives for the early games)
  workflow_dispatch:        # lets you press a Run button yourself (this also fetches fresh odds)

permissions:
  contents: write           # lets the workflow save history.csv and odds_cache.json back to your repository
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python td_model.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_FETCH: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 21 * * 5') && '1' || '0' }}
      - name: Save history and odds
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add history.csv
          if [ -f odds_cache.json ]; then git add odds_cache.json; fi
          git diff --cached --quiet || git commit -m "Update pick history"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
