name: Update picks

on:
  schedule:
    - cron: "0 15 * * 3"   # Wednesday, 15:00 UTC
    - cron: "0 21 * * 5"   # Friday, 21:00 UTC (after the final injury report)
    - cron: "0 15 * * 0"   # Sunday, 15:00 UTC (morning of the games)
  workflow_dispatch:        # lets you press a Run button yourself

permissions:
  contents: write           # lets the workflow save history.csv back to your repository
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python td_model.py
      - name: Save pick history
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add history.csv
          git diff --cached --quiet || git commit -m "Update pick history"
          git pull --rebase
          git push
      - name: Add college football page
        run: |
          mkdir -p site
          cp -r cfb site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
