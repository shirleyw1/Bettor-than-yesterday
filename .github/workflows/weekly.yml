name: Update picks

on:
  schedule:
    - cron: "0 15 * * 3"   # Wednesday, 15:00 UTC
    - cron: "0 21 * * 5"   # Friday, 21:00 UTC (after the final injury report)
    - cron: "0 15 * * 0"   # Sunday, 15:00 UTC (morning of the games)
  workflow_dispatch:        # lets you press a Run button yourself

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          mkdir site
          cd site
          python ../td_model.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
